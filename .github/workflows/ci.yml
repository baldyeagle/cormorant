name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit:
    name: CormorantKit (swift test)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --package-path packages/CormorantKit
      - name: Test
        # Live filter-list download is opt-in (CORMORANT_LIVE_TESTS=1) and stays off in CI.
        run: swift test --package-path packages/CormorantKit

  ios:
    name: iOS app (simulator build, default-browser checklist, UI tests)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Default-browser plist checklist (source)
        run: scripts/check-default-browser-plist.sh
      - name: Build for simulator
        run: |
          mkdir -p build
          xcodebuild -workspace Cormorant.xcworkspace -scheme Cormorant \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD" | grep -v appintentsmetadataprocessor || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Default-browser plist checklist (built app)
        run: scripts/check-default-browser-plist.sh build/DerivedData/Build/Products/Debug-iphonesimulator/Cormorant.app
      - name: Fail on warnings in app code
        run: |
          if grep -E "apps/ios/.*warning:" build/xcodebuild.log; then
            echo "Compiler warnings in apps/ios"; exit 1
          fi
      - name: UI tests
        run: |
          # Newest iOS runtime's first iPhone; the runner's simulator names change with each Xcode.
          UDID=$(xcrun simctl list -j devices available | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(n) for n in re.findall(r"\d+", k)])
          print(next(d["udid"] for k in reversed(ios) for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          # Boot first: a cold boot under xcodebuild can outlast the app launch ("does not have a
          # process ID"). One retry covers the remaining launch flakes; the regression fails every time.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -workspace Cormorant.xcworkspace -scheme Cormorant \
            -destination "platform=iOS Simulator,id=$UDID" -configuration Debug \
            -derivedDataPath build/DerivedData -resultBundlePath build/UITests.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test | tee build/xcodebuild-test.log | grep -E "error:|Test Case .*(passed|failed)|TEST" || true
          grep -q "TEST SUCCEEDED" build/xcodebuild-test.log
          if grep -E "apps/ios/.*warning:" build/xcodebuild-test.log; then
            echo "Compiler warnings in apps/ios"; exit 1
          fi
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            build/UITests.xcresult
            build/xcodebuild-test.log

  site:
    name: Site (Astro build, check, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        # Installs node, pnpm and vite-plus from mise.toml.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: vp run site:build
      - name: Check
        run: vp run site:test
      - name: Lint
        run: vp lint
      - name: Format
        run: vp fmt --check
