name: CI

on:
  pull_request:
    # `labeled`: adding the ui-stress label runs the UI tests several times over (see ui-tests).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      iterations:
        description: Times to run each UI test; every run must pass
        default: '5'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit:
    name: CormorantKit (swift test)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --package-path packages/CormorantKit
      - name: Test
        # Live filter-list download is opt-in (CORMORANT_LIVE_TESTS=1) and stays off in CI.
        run: swift test --package-path packages/CormorantKit

  ios:
    name: iOS app (simulator build, default-browser checklist)
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      xcode: ${{ steps.xcode.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the runner
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "path=$XCODE" >> "$GITHUB_OUTPUT"
      - name: Default-browser plist checklist (source)
        run: scripts/check-default-browser-plist.sh
      - name: Build for testing
        # Builds the app and the UI tests once; the ui-tests shards run them without building.
        # arm64 only: the generic destination would also build x86_64, which no Apple silicon runner uses.
        run: |
          mkdir -p build
          xcodebuild -workspace Cormorant.xcworkspace -scheme Cormorant \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            build-for-testing | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD" | grep -v appintentsmetadataprocessor || true
          grep -q "TEST BUILD SUCCEEDED" build/xcodebuild.log
      - name: Default-browser plist checklist (built app)
        run: scripts/check-default-browser-plist.sh build/DerivedData/Build/Products/Debug-iphonesimulator/Cormorant.app
      - name: Fail on warnings in app code
        run: |
          if grep -E "apps/ios/.*warning:" build/xcodebuild.log; then
            echo "Compiler warnings in apps/ios"; exit 1
          fi
      - name: Package the build
        # A tarball keeps the executables' permissions, which upload-artifact drops.
        run: tar -czf build/products.tgz -C build/DerivedData/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: ios-products
          path: build/products.tgz
          compression-level: 0
          retention-days: 1

  ui-tests:
    name: UI tests (shard ${{ matrix.shard }})
    needs: ios
    runs-on: xcode-27
    # The slowest single run of a shard seen took 21 minutes; a stress run (see ITERATIONS below)
    # gets a hosted runner's maximum. Expressions have no arithmetic, so it can't scale.
    timeout-minutes: ${{ (inputs.iterations || contains(github.event.pull_request.labels.*.name, 'ui-stress')) && 360 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Tests are dealt out by scripts/ui-test-shard.py; add an entry here for another shard.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode that built the tests
        # A runner from a newer image rollout may not have it; fail rather than run with another.
        run: |
          sudo xcode-select -s "${{ needs.ios.outputs.xcode }}"
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: ios-products
          path: build
      - name: Unpack the build
        run: tar -xzf build/products.tgz -C build
      - name: Boot a simulator
        run: |
          # Newest iOS runtime's first iPhone; the runner's simulator names change with each Xcode.
          UDID=$(xcrun simctl list -j devices available | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(n) for n in re.findall(r"\d+", k)])
          print(next(d["udid"] for k in reversed(ios) for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          # Boot first: a cold boot under xcodebuild can outlast the app launch ("does not have a
          # process ID").
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: UI tests
        env:
          # Once normally. To look for flaky tests, run the workflow by hand or add the ui-stress
          # label to the PR: each test runs that many times and every run must pass. Nothing is
          # retried, so a flaky test fails CI rather than hiding behind a second try.
          ITERATIONS: ${{ inputs.iterations || (contains(github.event.pull_request.labels.*.name, 'ui-stress') && '5') || '1' }}
        run: |
          ONLY_TESTING=$(scripts/ui-test-shard.py ${{ strategy.job-index }} ${{ strategy.job-total }})
          XCTESTRUN=$(ls build/Products/*.xctestrun)
          # No sysdiagnose on failure: collecting one hung a run for 10 minutes and the result
          # bundle's recording and log say what failed.
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath build/UITests.xcresult \
            -test-iterations "$ITERATIONS" -collect-test-diagnostics never \
            $ONLY_TESTING \
            | tee build/xcodebuild-test.log | grep -E "error:|Test Case .*(passed|failed)|TEST" || true
          grep -q "TEST EXECUTE SUCCEEDED" build/xcodebuild-test.log
      - name: Upload UI test results
        # Cancelled too: a shard that hits its timeout is cancelled, not failed.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            build/UITests.xcresult
            build/xcodebuild-test.log

  site:
    name: Site (Astro build, check, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        # Installs node, pnpm and vite-plus from mise.toml.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: vp run site:build
      - name: Check
        run: vp run site:test
      - name: Lint
        run: vp lint
      - name: Format
        run: vp fmt --check
