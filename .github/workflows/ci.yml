name: CI

on:
  pull_request:
    # `labeled`: adding the ui-stress label runs the UI tests several times over (see ios).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      iterations:
        description: Times to run each UI test; every run must pass
        default: '5'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          # The PR's merge commit and its parents.
          fetch-depth: 2
      - name: Does this touch the app, the package or CI?
        id: diff
        # A PR that changes none of them (the site, docs) skips the macOS jobs. Pushes to main, runs
        # by hand and ui-stress PRs always run them.
        env:
          STRESS: ${{ contains(github.event.pull_request.labels.*.name, 'ui-stress') }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$STRESS" = true ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Against the base branch's tip: everything the PR would change, both sides of a move.
          CHANGED=$(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(apps/ios|packages|Cormorant\.xcworkspace|scripts|\.github)/'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    # Shard 1 also runs the package's tests and checks the built app; the others only test.
    name: ${{ matrix.shard == 1 && 'iOS app, CormorantKit and UI tests (shard 1)' || format('UI tests (shard {0})', matrix.shard) }}
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    # The slowest single run of a shard seen took 21 minutes, before shards built for themselves
    # (a build adds 1-2); a stress run (see ITERATIONS below) gets a hosted runner's maximum.
    # Expressions have no arithmetic, so it can't scale.
    timeout-minutes: ${{ (inputs.iterations || contains(github.event.pull_request.labels.*.name, 'ui-stress')) && 360 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Tests are dealt out by scripts/ui-test-shard.py, balanced by the times in
        # scripts/ui-test-durations.txt. Five, as many as GitHub Free runs on macOS at once: a sixth
        # shard would wait for one of these to finish, and so does any other run started meanwhile.
        shard: [1, 2, 3, 4, 5]
    env:
      # The simulator's iOS, so a run doesn't depend on which image a shard lands on: the 2026-11-04
      # image added iOS 27.2, where three caret-sheet tests failed (docs/product/todo.md). Absent,
      # the newest iOS is used, with a warning.
      SIMULATOR_IOS: '27.1'
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Build for testing
        id: build
        # Each shard builds for itself rather than wait on one build job and its artifact.
        # arm64 only: the generic destination would also build x86_64, which no Apple silicon runner uses.
        run: |
          mkdir -p build
          xcodebuild -workspace Cormorant.xcworkspace -scheme Cormorant \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            build-for-testing | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD" | grep -v appintentsmetadataprocessor || true
          grep -q "TEST BUILD SUCCEEDED" build/xcodebuild.log
      # Shard 1's checks: each runs even when another fails, and none keeps its UI tests from running.
      - name: Default-browser plist checklist (source)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: scripts/check-default-browser-plist.sh
      - name: Default-browser plist checklist (built app)
        if: ${{ !cancelled() && matrix.shard == 1 && steps.build.outcome == 'success' }}
        run: scripts/check-default-browser-plist.sh build/DerivedData/Build/Products/Debug-iphonesimulator/Cormorant.app
      - name: Fail on warnings in app code
        if: ${{ !cancelled() && matrix.shard == 1 && steps.build.outcome == 'success' }}
        run: |
          if grep -E "apps/ios/.*warning:" build/xcodebuild.log; then
            echo "Compiler warnings in apps/ios"; exit 1
          fi
      - name: CormorantKit (swift test)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        # Live filter-list download is opt-in (CORMORANT_LIVE_TESTS=1) and stays off in CI.
        run: |
          swift build --package-path packages/CormorantKit
          swift test --package-path packages/CormorantKit
      - name: Boot a simulator
        id: boot
        # After the build, not during it: on these 3-core, 7 GB runners a build beside a booting
        # simulator took 7-13 minutes instead of 1.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # First iPhone on iOS $SIMULATOR_IOS, else on the newest iOS; the runner's simulator names
          # change with each Xcode.
          UDID=$(xcrun simctl list -j devices available | python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(n) for n in re.findall(r"\d+", k)])
          pinned = [k for k in ios if k.endswith("iOS-" + os.environ["SIMULATOR_IOS"].replace(".", "-"))]
          if not pinned:
              print("::warning::No iOS " + os.environ["SIMULATOR_IOS"] + " simulator; using the newest", file=sys.stderr)
          print(next(d["udid"] for k in reversed(pinned or ios) for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # Boot first: a cold boot under xcodebuild can outlast the app launch ("does not have a
          # process ID"). A boot that fails here is tried again by `bootstatus -b`.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # A fresh simulator renders its whole wallpaper gallery (PosterBoard) and its widgets
          # (chronod): 100+ extension launches in bursts that took this 3-core runner from the tests
          # and timed them out. Disable both, so launchd never starts them again, and boot out the
          # running ones, which takes their extensions with them. (Shutting down and booting again
          # instead cost 2.5-3.5 minutes a shard.) The rest stayed busy for minutes after a boot and
          # nothing under test uses them: App Store engagement, Health, mail and calendar accounts, and
          # Siri's suggestions. Not the log streamer (diagnosticd), though it's busy too: without it
          # every process, the app included, kept looking it up, up to ~2,800 failed lookups a second,
          # each logged by launchd (half of a stress run's simulator log). `disable` succeeds even for a
          # label that doesn't exist, so check afterwards: a runtime that renames one gets a warning,
          # not a failed run.
          PRIVATE_SERVICES="user/$(id -u)/com.apple.PosterBoard system/com.apple.chronod
            system/com.apple.amsengagementd system/com.apple.healthappd system/com.apple.dataaccess.dataaccessd
            system/com.apple.siriinferenced"
          for service in $PRIVATE_SERVICES; do
            xcrun simctl spawn "$UDID" launchctl disable "$service"
            xcrun simctl spawn "$UDID" launchctl bootout "$service" || true
          done
          for service in $PRIVATE_SERVICES; do
            if xcrun simctl spawn "$UDID" launchctl print "$service" > /dev/null 2>&1; then
              echo "::warning::$service is still loaded; the simulator may take the runner from the tests"
            fi
          done
      - name: UI tests
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        env:
          # Once normally. To look for flaky tests, run the workflow by hand or add the ui-stress
          # label to the PR: each test runs that many times and every run must pass. Nothing is
          # retried, so a flaky test fails CI rather than hiding behind a second try.
          ITERATIONS: ${{ inputs.iterations || (contains(github.event.pull_request.labels.*.name, 'ui-stress') && '5') || '1' }}
        run: |
          # Shard 1 deals itself less, for the ~90 s of package tests and checks it runs first.
          ONLY_TESTING=$(scripts/ui-test-shard.py ${{ strategy.job-index }} ${{ strategy.job-total }} 90)
          XCTESTRUN=$(ls build/DerivedData/Build/Products/*.xctestrun)
          # No screen recording: XCTest encodes video of every test in software (on a 3-core VM, with
          # no GPU) and keeps it only on failure, and automatic screenshots would cost an image per
          # action. UITestCase attaches its own screenshot and accessibility tree at a failure.
          [ "$(plutil -extract TestConfigurations.0.TestTargets.0.BlueprintName raw "$XCTESTRUN")" = CormorantUITests ]
          plutil -replace TestConfigurations.0.TestTargets.0.PreferredScreenCaptureFormat -string screenshots "$XCTESTRUN"
          plutil -replace TestConfigurations.0.TestTargets.0.SystemAttachmentLifetime -string keepNever "$XCTESTRUN"
          # A mistyped manual stress run must fail, not quietly run each test once.
          case "$ITERATIONS" in
            '' | *[!0-9]* | 0 | 0*) echo "::error::iterations must be a positive integer, got '$ITERATIONS'"; exit 1 ;;
          esac
          # xcodebuild rejects -test-iterations 1 ("Must specify -test-iterations with more than 1
          # iteration"), so a single run leaves the flag off.
          ITERATION_ARGS=()
          if [ "$ITERATIONS" -gt 1 ]; then ITERATION_ARGS=(-test-iterations "$ITERATIONS"); fi
          # No sysdiagnose on failure: collecting one hung a run for 10 minutes, and the result
          # bundle's attachments and the simulator's log say what failed.
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath build/UITests.xcresult \
            "${ITERATION_ARGS[@]}" -collect-test-diagnostics never \
            $ONLY_TESTING \
            | tee build/xcodebuild-test.log | grep -E "error:|Test Case .*(passed|failed)|TEST" || true
          grep -q "TEST EXECUTE SUCCEEDED" build/xcodebuild-test.log
      - name: Save the simulator's log
        # The system's side of a failure: XCTest sometimes couldn't terminate the app, and why is
        # only in the launch and termination services' logs.
        if: (failure() || cancelled()) && env.UDID != ''
        timeout-minutes: 5
        run: |
          xcrun simctl spawn "$UDID" log show --last 6h --info --style compact --predicate \
            'process IN {"Cormorant", "SpringBoard", "runningboardd", "testmanagerd", "backboardd", "launchd_sim"}' \
            | gzip > build/simulator-log.txt.gz || true
      - name: Upload UI test results
        # Cancelled too: a shard that hits its timeout is cancelled, not failed.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            build/xcodebuild.log
            build/UITests.xcresult
            build/xcodebuild-test.log
            build/simulator-log.txt.gz

  site:
    name: Site (Astro build, check, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        # Installs node, pnpm and vite-plus from mise.toml.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: vp run site:build
      - name: Check
        run: vp run site:test
      - name: Lint
        run: vp lint
      - name: Format
        run: vp fmt --check
