name: CI

on:
  pull_request:
    # `labeled`: adding the ui-stress label runs the UI tests several times over (see ios).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # Nightly stress run on main, 08:23 UTC (after midnight Pacific; off the hour, which GitHub may
    # delay or drop under load): every UI test 5 times, quarantined ones too (see ios).
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: Times to run each UI test; every run must pass
        default: '5'

concurrency:
  # The nightly run has a group of its own, so a push to main doesn't cancel it (or it the push).
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
      new_tests: ${{ steps.new.outputs.tests }}
      new_tests_timeout: ${{ steps.new.outputs.timeout }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # The PR's merge commit and its parents.
          fetch-depth: 2
      - name: Does this touch the app, the package or CI?
        id: diff
        # A PR that changes none of them (the site, docs) skips the macOS jobs. Pushes to main, runs
        # by hand and ui-stress PRs always run them.
        env:
          STRESS: ${{ contains(github.event.pull_request.labels.*.name, 'ui-stress') }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$STRESS" = true ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Against the base branch's tip: everything the PR would change, both sides of a move.
          CHANGED=$(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(apps/ios|packages|Cormorant\.xcworkspace|scripts|\.github)/'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Which UI tests does this PR add?
        id: new
        # New or renamed: in the merge commit but not on the base branch. ios runs each 10 more times,
        # spread over the shards, so its timeout grows ~12 minutes for every 5. A failure here mustn't
        # skip the macOS jobs: their dealing step fails the same way.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          NEW=$(scripts/ui-test-shard.py --new-since HEAD^1)
          echo "${NEW:-none}"
          echo "tests=$NEW" >> "$GITHUB_OUTPUT"
          COUNT=$(echo $NEW | wc -w)
          if [ "$COUNT" -gt 0 ]; then
            MINUTES=$(( 45 + 12 * ((COUNT + 4) / 5) ))
            echo "timeout=$(( MINUTES > 360 ? 360 : MINUTES ))" >> "$GITHUB_OUTPUT"
          fi

  quarantine:
    name: UI test quarantine
    # Its own job, so an entry past its 14 days (or one naming no test) fails in seconds, build or not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No quarantined UI test past its 14 days
        run: scripts/ui-test-shard.py --check-quarantine

  ios:
    # Shard 1 also runs the package's tests, the app's in-process tests and checks the built app; the
    # others only run UI tests.
    name: ${{ matrix.shard == 1 && 'iOS app, CormorantKit, app tests and UI tests (shard 1)' || format('UI tests (shard {0})', matrix.shard) }}
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    # 45 minutes: on the November 2026 images booting the simulator alone took 4-8 minutes and a
    # shard's tests up to ~20, which 30 cut off (cancelled shards on main and PRs alike, nothing
    # failed); a stress run (see ITERATIONS below) gets a hosted runner's maximum, and a PR
    # that adds UI tests the time changes works out for their extra runs. Expressions have no
    # arithmetic, so a stress run can't scale.
    timeout-minutes: ${{ (inputs.iterations || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'ui-stress')) && 360 || fromJSON(needs.changes.outputs.new_tests_timeout || '45') }}
    strategy:
      fail-fast: false
      matrix:
        # Tests are dealt out by scripts/ui-test-shard.py, balanced by the times in
        # scripts/ui-test-durations.txt. Five, as many as GitHub Free runs on macOS at once: a sixth
        # shard would wait for one of these to finish, and so does any other run started meanwhile.
        shard: [1, 2, 3, 4, 5]
    env:
      # The simulator's iOS, so a run doesn't depend on which image a shard lands on: the 2026-11-04
      # image added iOS 27.2, where three caret-sheet tests failed (docs/product/todo.md). Absent,
      # the newest iOS is used, with a warning.
      SIMULATOR_IOS: '27.1'
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Deal this shard's tests
        # Before the build, so a bad quarantine entry stops the shard in seconds (shard 1's package tests
        # and source checks still run, on the right Xcode). Shard 1 deals itself less, for the ~90 s
        # of package tests and checks and the ~4 minutes of app tests it runs first. Tests in
        # scripts/ui-test-quarantine.txt sit out, except nightly and by hand, so a fix shows. The PR's
        # new tests weigh their extra runs.
        env:
          QUARANTINED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--include-quarantined' || '' }}
          NEW_TESTS: ${{ needs.changes.outputs.new_tests }}
        run: |
          DEAL="${{ strategy.job-index }} ${{ strategy.job-total }} 330 $QUARANTINED"
          ONLY_TESTING=$(scripts/ui-test-shard.py $DEAL --new "$NEW_TESTS")
          NEW_ONLY_TESTING=$(scripts/ui-test-shard.py $DEAL --new "$NEW_TESTS" --only-new)
          echo "ONLY_TESTING=$ONLY_TESTING" >> "$GITHUB_ENV"
          echo "NEW_ONLY_TESTING=$NEW_ONLY_TESTING" >> "$GITHUB_ENV"
      - name: Build for testing
        id: build
        # Each shard builds for itself rather than wait on one build job and its artifact.
        # arm64 only: the generic destination would also build x86_64, which no Apple silicon runner uses.
        run: |
          mkdir -p build
          xcodebuild -workspace Cormorant.xcworkspace -scheme Cormorant \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            build-for-testing | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD" | grep -v appintentsmetadataprocessor || true
          grep -q "TEST BUILD SUCCEEDED" build/xcodebuild.log
      # Shard 1's checks: each runs even when another fails, and none keeps its UI tests from running.
      - name: Default-browser plist checklist (source)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: scripts/check-default-browser-plist.sh
      - name: Default-browser plist checklist (built app)
        if: ${{ !cancelled() && matrix.shard == 1 && steps.build.outcome == 'success' }}
        run: scripts/check-default-browser-plist.sh build/DerivedData/Build/Products/Debug-iphonesimulator/Cormorant.app
      - name: Fail on warnings in app code
        if: ${{ !cancelled() && matrix.shard == 1 && steps.build.outcome == 'success' }}
        run: |
          if grep -E "apps/ios/.*warning:" build/xcodebuild.log; then
            echo "Compiler warnings in apps/ios"; exit 1
          fi
      - name: CormorantKit (swift test)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        # Live filter-list download is opt-in (CORMORANT_LIVE_TESTS=1) and stays off in CI.
        run: |
          swift build --package-path packages/CormorantKit
          swift test --package-path packages/CormorantKit
      - name: Boot a simulator
        id: boot
        # After the build, not during it: on these 3-core, 7 GB runners a build beside a booting
        # simulator took 7-13 minutes instead of 1.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # First iPhone on iOS $SIMULATOR_IOS, else on the newest iOS; the runner's simulator names
          # change with each Xcode.
          UDID=$(xcrun simctl list -j devices available | python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(n) for n in re.findall(r"\d+", k)])
          pinned = [k for k in ios if k.endswith("iOS-" + os.environ["SIMULATOR_IOS"].replace(".", "-"))]
          if not pinned:
              print("::warning::No iOS " + os.environ["SIMULATOR_IOS"] + " simulator; using the newest", file=sys.stderr)
          print(next(d["udid"] for k in reversed(pinned or ios) for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # Boot first: a cold boot under xcodebuild can outlast the app launch ("does not have a
          # process ID"). A boot that fails here is tried again by `bootstatus -b`.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # A fresh simulator renders its whole wallpaper gallery (PosterBoard) and its widgets
          # (chronod): 100+ extension launches in bursts that took this 3-core runner from the tests
          # and timed them out. Disable both, so launchd never starts them again, and boot out the
          # running ones, which takes their extensions with them. (Shutting down and booting again
          # instead cost 2.5-3.5 minutes a shard.) The rest stayed busy for minutes after a boot and
          # nothing under test uses them: App Store engagement, Health, mail and calendar accounts, and
          # Siri's suggestions. Not the log streamer (diagnosticd), though it's busy too: without it
          # every process, the app included, kept looking it up, up to ~2,800 failed lookups a second,
          # each logged by launchd (half of a stress run's simulator log). `disable` succeeds even for a
          # label that doesn't exist, so check afterwards: a runtime that renames one gets a warning,
          # not a failed run.
          PRIVATE_SERVICES="user/$(id -u)/com.apple.PosterBoard system/com.apple.chronod
            system/com.apple.amsengagementd system/com.apple.healthappd system/com.apple.dataaccess.dataaccessd
            system/com.apple.siriinferenced"
          for service in $PRIVATE_SERVICES; do
            xcrun simctl spawn "$UDID" launchctl disable "$service"
            xcrun simctl spawn "$UDID" launchctl bootout "$service" || true
          done
          for service in $PRIVATE_SERVICES; do
            if xcrun simctl spawn "$UDID" launchctl print "$service" > /dev/null 2>&1; then
              echo "::warning::$service is still loaded; the simulator may take the runner from the tests"
            fi
          done
      - name: App tests (in-process)
        # CormorantTests: Swift Testing inside the app, against a real BrowserStore and WebKit, nothing
        # tapped. Most of what the app does is tested here; the UI tests keep what only the screen
        # shows. Run as many times as the UI tests in a stress run or the nightly one.
        if: ${{ !cancelled() && matrix.shard == 1 && steps.boot.outcome == 'success' }}
        env:
          ITERATIONS: ${{ inputs.iterations || ((github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'ui-stress')) && '5') || '1' }}
        run: |
          XCTESTRUN=$(ls build/DerivedData/Build/Products/*.xctestrun)
          ITERATION_ARGS=()
          if [ "$ITERATIONS" -gt 1 ]; then ITERATION_ARGS=(-test-iterations "$ITERATIONS"); fi
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath build/AppTests.xcresult \
            "${ITERATION_ARGS[@]}" -collect-test-diagnostics never \
            -only-testing:CormorantTests \
            | tee build/xcodebuild-app-tests.log | grep -E "error:|✘|✔|Test run|TEST" || true
          grep -q "TEST EXECUTE SUCCEEDED" build/xcodebuild-app-tests.log
      - name: UI tests
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        env:
          # Once normally. To look for flaky tests, run the workflow by hand or add the ui-stress
          # label to the PR: each test runs that many times and every run must pass. The nightly run
          # does 5. Nothing is retried, so a flaky test fails CI rather than hiding behind a second try.
          ITERATIONS: ${{ inputs.iterations || ((github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'ui-stress')) && '5') || '1' }}
        run: |
          # When the tests started, for the simulator's log. No tests dealt would run them all.
          echo "TESTS_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$ONLY_TESTING" ] || { echo "::error::No tests were dealt to this shard"; exit 1; }
          XCTESTRUN=$(ls build/DerivedData/Build/Products/*.xctestrun)
          # No screen recording: XCTest encodes video of every test in software (on a 3-core VM, with
          # no GPU) and keeps it only on failure, and automatic screenshots would cost an image per
          # action. UITestCase attaches its own screenshot and accessibility tree at a failure.
          # The UI tests' entry among the test targets (CormorantTests is another), by name.
          UI=$(plutil -convert json -o - "$XCTESTRUN" | python3 -c '
          import json, sys
          targets = json.load(sys.stdin)["TestConfigurations"][0]["TestTargets"]
          print([t["BlueprintName"] for t in targets].index("CormorantUITests"))
          ')
          plutil -replace TestConfigurations.0.TestTargets.$UI.PreferredScreenCaptureFormat -string screenshots "$XCTESTRUN"
          plutil -replace TestConfigurations.0.TestTargets.$UI.SystemAttachmentLifetime -string keepNever "$XCTESTRUN"
          # A mistyped manual stress run must fail, not quietly run each test once.
          case "$ITERATIONS" in
            '' | *[!0-9]* | 0 | 0*) echo "::error::iterations must be a positive integer, got '$ITERATIONS'"; exit 1 ;;
          esac
          # xcodebuild rejects -test-iterations 1 ("Must specify -test-iterations with more than 1
          # iteration"), so a single run leaves the flag off.
          ITERATION_ARGS=()
          if [ "$ITERATIONS" -gt 1 ]; then ITERATION_ARGS=(-test-iterations "$ITERATIONS"); fi
          # No sysdiagnose on failure: collecting one hung a run for 10 minutes, and the result
          # bundle's attachments and the simulator's log say what failed.
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath build/UITests.xcresult \
            "${ITERATION_ARGS[@]}" -collect-test-diagnostics never \
            $ONLY_TESTING \
            | tee build/xcodebuild-test.log | grep --line-buffered -E "error:|Test Case .*(passed|failed)|TEST" || true
          grep -q "TEST EXECUTE SUCCEEDED" build/xcodebuild-test.log
      - name: New UI tests, 10 more times each
        # A test this PR adds or renames proves itself before it gates other PRs: after the shard's own
        # run, each new test it was dealt runs 10 more times (scripts/ui-test-shard.py weighs them for
        # it), and one failure fails CI. The UI tests step has set up the xctestrun.
        if: ${{ !cancelled() && steps.boot.outcome == 'success' && env.NEW_ONLY_TESTING != '' }}
        run: |
          XCTESTRUN=$(ls build/DerivedData/Build/Products/*.xctestrun)
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath build/NewUITests.xcresult \
            -test-iterations 10 -collect-test-diagnostics never \
            $NEW_ONLY_TESTING \
            | tee build/xcodebuild-new-tests.log | grep --line-buffered -E "error:|Test Case .*(passed|failed)|TEST" || true
          grep -q "TEST EXECUTE SUCCEEDED" build/xcodebuild-new-tests.log
      - name: List the failed UI tests
        # Each failed test and its message on the run's summary page, so nobody digs through logs.
        if: (failure() || cancelled()) && env.UDID != ''
        run: |
          {
            scripts/flake-report.py --summary --title "Failed UI tests (shard ${{ matrix.shard }})" build/xcodebuild-test.log
            scripts/flake-report.py --summary --title "Failed new UI tests, 10 runs each (shard ${{ matrix.shard }})" build/xcodebuild-new-tests.log
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save the simulator's log
        # The system's side of a failure: XCTest sometimes couldn't terminate the app, and why is
        # only in the launch and termination services' logs.
        if: (failure() || cancelled()) && env.UDID != ''
        timeout-minutes: 5
        run: |
          # Since the tests started, not the last 6 hours, and cut off after 4 minutes: a stress run's
          # log outlasted the step's timeout and left nothing. `log show` prints oldest first, so a cut
          # keeps the run's start (where a stress run's failures most often are) and loses its end.
          MINUTES=$(( ($(date +%s) - ${TESTS_STARTED_AT:-0}) / 60 + 2 ))
          if [ "$MINUTES" -gt 360 ]; then MINUTES=360; fi
          xcrun simctl spawn "$UDID" log show --last "${MINUTES}m" --info --style compact --predicate \
            'process IN {"Cormorant", "SpringBoard", "runningboardd", "testmanagerd", "backboardd", "launchd_sim"}' \
            > build/simulator-log.txt &
          LOG_SHOW=$!
          ( sleep 240; kill "$LOG_SHOW" ) > /dev/null 2>&1 &
          WATCHDOG=$!
          wait "$LOG_SHOW" || true
          kill "$WATCHDOG" 2> /dev/null || true
          gzip -f build/simulator-log.txt || true
      - name: Upload UI test results
        # Cancelled too: a shard that hits its timeout is cancelled, not failed.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            build/xcodebuild.log
            build/AppTests.xcresult
            build/xcodebuild-app-tests.log
            build/UITests.xcresult
            build/xcodebuild-test.log
            build/NewUITests.xcresult
            build/xcodebuild-new-tests.log
            build/simulator-log.txt.gz

  site:
    name: Site (Astro build, check, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        # Installs node, pnpm and vite-plus from mise.toml.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: vp run site:build
      - name: Check
        run: vp run site:test
      - name: Lint
        run: vp lint
      - name: Format
        run: vp fmt --check
